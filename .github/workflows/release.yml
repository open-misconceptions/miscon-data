name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.1. If it does not exist yet it is created at the dispatched commit."
        required: true
        type: string

permissions:
  contents: write
  id-token: write # lets the job request a GitHub OIDC token for the Hugging Face Trusted Publisher exchange

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      # Hugging Face dataset mirror. Authentication is the Hub's Trusted Publisher:
      # the hf CLI exchanges this job's GitHub OIDC token for a one-hour token scoped
      # to HF_OIDC_RESOURCE. No HF_TOKEN secret is needed; if one is set it is used
      # as a fallback. The mirror steps never fail the release.
      HF_DATASET: open-misconceptions/miscon-data
      HF_OIDC_RESOURCE: datasets/open-misconceptions/miscon-data
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the release target
        id: target
        run: |
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" >/dev/null; then
            git checkout -q "refs/tags/${RELEASE_TAG}"
            echo "Building existing tag ${RELEASE_TAG} at $(git rev-parse --short HEAD)"
          else
            echo "Tag ${RELEASE_TAG} does not exist; it will be created at ${GITHUB_SHA::7} when the release is published"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: The released version must be the version being released
        run: |
          set -euo pipefail
          want="${RELEASE_TAG#v}"
          have="$(python3 -c 'import json; print(json.load(open("miscon.config.json"))["library_version"])')"
          cff="$(sed -n 's/^version: *//p' CITATION.cff | head -n1)"
          bad=""
          [ "$have" = "$want" ] || bad="${bad} miscon.config.json library_version=${have}"
          [ "$cff" = "$want" ] || bad="${bad} CITATION.cff version=${cff}"
          if [ -n "$bad" ]; then
            {
              echo "### Release refused"
              echo
              echo "This release is \`${RELEASE_TAG}\`, so every hand-maintained version must read \`${want}\`."
              echo "Disagreeing:\`${bad}\`"
              echo
              echo "These are not cosmetic. The Pages site is built from \`main\` and prints"
              echo "\`library_version\` in its footer. \`CITATION.cff\` is what GitHub's \"Cite this"
              echo "repository\" widget and Zenodo read, **at the tag** — and the tag is cut from the"
              echo "tree, so nothing this workflow rewrites can reach it. v0.2.0 shipped claiming"
              echo "0.1.1 exactly this way."
              echo
              echo "Set both to \`${want}\`, commit, then release again."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::version mismatch for ${RELEASE_TAG}:${bad}"
            exit 1
          fi
          echo "library_version and CITATION.cff both read ${want}, matching ${RELEASE_TAG}." \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e tools/miscon
      - run: python -m unittest discover -s tools/tests
      - run: miscon validate records/ --strict
      # CITATION.cff is deliberately NOT rewritten here. It used to be, and the
      # rewrite reached only the packaged asset: the tag is cut from the tree, so
      # the tagged CITATION.cff -- the one GitHub's "Cite this repository" widget
      # and Zenodo read -- kept whatever was committed. v0.2.0 shipped claiming
      # 0.1.1 that way, while the step reported success. `version` and
      # `date-released` are now maintained in the release-prep commit alongside
      # `library_version`, the guard above refuses a release when they disagree
      # with the tag, and `miscon validate` catches the drift on every PR.
      - name: Export distributions stamped with the tag
        run: miscon export all --version "${RELEASE_TAG#v}"
      - name: Attach distributions to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ steps.target.outputs.sha }}
          files: |
            dist/miscon.case.json
            dist/miscon.jsonl
            dist/miscon.csv
            CITATION.cff
          generate_release_notes: true

      - name: Install the hf CLI
        id: hf_cli
        continue-on-error: true
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash -s -- --exclude-skill
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Mirror the dataset to Hugging Face
        if: steps.hf_cli.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          hf upload "$HF_DATASET" dist/miscon.jsonl miscon.jsonl --repo-type dataset \
            --commit-message "Mirror ${RELEASE_TAG} from open-misconceptions/miscon-data"
          hf upload "$HF_DATASET" dist/huggingface/README.md README.md --repo-type dataset \
            --commit-message "Dataset card for ${RELEASE_TAG}"
          echo "::notice::Mirrored ${RELEASE_TAG} to https://huggingface.co/datasets/${HF_DATASET}"
      - name: Report mirror outcome
        if: always()
        run: |
          if [ "${{ steps.hf_cli.outcome }}" != "success" ]; then
            echo "::warning::Hugging Face mirror skipped: hf CLI install failed."
          fi
