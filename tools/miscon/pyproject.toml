[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miscon-tools"
version = "0.1.0"
description = "Validator, exporter and site builder for Open Misconceptions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.18"]

[project.scripts]
miscon = "miscon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["miscon*"]
